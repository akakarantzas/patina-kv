plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'me.champeau.jmh' version '0.7.4'
}

group = 'dev.patina'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    jmh 'org.rocksdb:rocksdbjni:11.8.1' // benchmarks only: the service never uses RocksDB
}

// Build the Rust engine first so the native library is always current.
def cargoBuild = tasks.register('cargoBuild', Exec) {
    workingDir = file('../engine')
    commandLine 'cargo', 'build', '--release'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn cargoBuild
    // The tests load this library, so a Rust-only change must not leave them UP-TO-DATE.
    inputs.file("../engine/target/release/${System.mapLibraryName('patina_engine')}")
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    dependsOn cargoBuild
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// ./gradlew jmh: Patina vs RocksDB (src/jmh), results in build/results/jmh/results.txt.
def nativeLibrary = file("../engine/target/release/${System.mapLibraryName('patina_engine')}")
jmh {
    jmhVersion = '1.37'
    jvmArgsAppend = ['--enable-native-access=ALL-UNNAMED', "-Dpatina.library=${nativeLibrary}".toString()]
}

tasks.named('jmh') {
    dependsOn cargoBuild
    inputs.file(nativeLibrary)
}
