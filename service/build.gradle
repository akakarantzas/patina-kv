plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.patina'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Build the Rust engine first so the native library is always current.
def cargoBuild = tasks.register('cargoBuild', Exec) {
    workingDir = file('../engine')
    commandLine 'cargo', 'build', '--release'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn cargoBuild
    // The tests load this library, so a Rust-only change must not leave them UP-TO-DATE.
    inputs.file("../engine/target/release/${System.mapLibraryName('patina_engine')}")
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    dependsOn cargoBuild
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
