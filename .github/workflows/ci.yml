name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the only place the #[cfg(unix)] directory-fsync code compiles and runs
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # the declared minimum (rust-version in engine/Cargo.toml), so "Rust 1.89+" in the readme stays true
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: cargo clippy
        working-directory: engine
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: engine
        run: cargo test
      - name: gradle test
        working-directory: service
        run: ./gradlew test
